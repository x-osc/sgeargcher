[package]
name = "sgeargcher"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
futures = "0.3.32"
scraper = "0.26.0"
tokio = { version = "1.50.0", features = ["rt-multi-thread", "macros"] }
url = "2.5.8"
urlencoding = "2.1.3"
wreq = { version = "5.3.0", features = [
  "cookies",
  "cookies-preserve-order",
  "gzip",
  "brotli",
  "zstd",
  "deflate",
  "json",
] }
wreq-util = "2.2.6"
